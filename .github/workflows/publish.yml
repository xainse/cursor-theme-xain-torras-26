name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package only, do not publish"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  # Opt in early to the Node.js 24 runtime for JavaScript actions
  # (GitHub will force this on 2026-06-16, see:
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    name: Package & publish to Open VSX
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read package metadata
        id: pkg
        run: |
          NAME=$(node -p "require('./package.json').name")
          PUBLISHER=$(node -p "require('./package.json').publisher")
          VERSION=$(node -p "require('./package.json').version")
          VSIX="${NAME}-${VERSION}.vsix"
          echo "name=${NAME}"           >> "$GITHUB_OUTPUT"
          echo "publisher=${PUBLISHER}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"     >> "$GITHUB_OUTPUT"
          echo "vsix=${VSIX}"           >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$TAG_VERSION" != "${{ steps.pkg.outputs.version }}" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match package.json version ${{ steps.pkg.outputs.version }}"
            exit 1
          fi

      - name: Package extension (.vsix)
        run: npx --yes @vscode/vsce package --out "${{ steps.pkg.outputs.vsix }}"

      - name: Upload .vsix as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.vsix }}
          path: ${{ steps.pkg.outputs.vsix }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Open VSX
        if: github.event_name == 'push' || github.event.inputs.dry_run != 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: ${{ steps.pkg.outputs.vsix }}
          PUBLISHER: ${{ steps.pkg.outputs.publisher }}
          EXT_NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          set +e
          OUTPUT=$(npx --yes ovsx publish "$VSIX" --pat "$OVSX_PAT" 2>&1)
          STATUS=$?
          set -e

          echo "$OUTPUT"

          if [ $STATUS -eq 0 ]; then
            echo "Published ${PUBLISHER}.${EXT_NAME}@${VERSION} to Open VSX."
            exit 0
          fi

          # Treat "already published" as a no-op so re-runs of the same
          # version (e.g. manual workflow_dispatch after a tag push) do not
          # fail the workflow.
          if echo "$OUTPUT" | grep -qiE "already (published|exists)"; then
            echo "::warning::${PUBLISHER}.${EXT_NAME}@${VERSION} is already on Open VSX. Skipping publish."
            exit 0
          fi

          exit $STATUS

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.vsix }}
          generate_release_notes: true
          fail_on_unmatched_files: true
